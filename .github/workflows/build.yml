name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test core
        run: dotnet test tests/Kuwata.Core.Tests -c Release
      - name: Build app
        run: dotnet build src/Kuwata.App -c Release -warnaserror:CS8600,CS8602,CS8604
      - name: Publish app
        run: dotnet publish src/Kuwata.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: Kuwata-win-x64
          path: publish/
